name: bronz_app
description: تطبيق متجر برونز — عطور ومكياج
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_flutter: ^4.8.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  onesignal_flutter: ^5.2.0
  flutter_svg: ^2.0.17
  # طبقة أيقونات محلية (المكتبة الأصلية لا تتوافق مع Flutter الحالي)
  phosphor_flutter:
    path: packages/phosphor_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# أيقونة التطبيق بكل المقاسات — تتولّد وقت البناء (iOS أولًا)
flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/branding/BRONZ_app_icon_4096.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

# الشاشة الافتتاحية الأصلية (تظهر لحظة فتح التطبيق قبل تشغيل Flutter)
flutter_native_splash:
  color: "#FFFFFF"
  background_image: "assets/branding/BRONZ_splash_graphite.png"
  ios: true
  android: false
  web: false
